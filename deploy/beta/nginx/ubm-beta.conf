# Nginx cho ban BETA — domain RIENG, chay SONG SONG ban chinh.
# Neu doi ten khac umbomilk-beta.duckdns.org thi thay 2 cho server_name.
#   https://umbomilk-beta.duckdns.org/        -> cong nhan vien (beta)
#   https://umbomilk-beta.duckdns.org/admin/  -> cong quan tri (beta)
#   https://umbomilk-beta.duckdns.org/api/    -> backend beta (cong 4006)
# Cai dat: sudo cp deploy/beta/nginx/ubm-beta.conf /etc/nginx/sites-available/ubm-beta
#   + symlink sites-enabled + reload + certbot --nginx -d umbomilk-beta.duckdns.org

upstream ubm_beta_backend {
  server 127.0.0.1:4006;
  keepalive 64;
}

map $http_upgrade $connection_upgrade_beta {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name umbomilk-beta.duckdns.org;
  # certbot tu them listen 443 ssl + redirect khi chay --nginx
  client_max_body_size 15m;

  location /api/ {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ubm_beta_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_beta;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location /admin/ {
    alias /opt/ubm-beta/admin-web/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
  }
  location /admin/assets/ {
    alias /opt/ubm-beta/admin-web/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    root /opt/ubm-beta/employee-web;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    root /opt/ubm-beta/employee-web;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
