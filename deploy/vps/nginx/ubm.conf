# Nginx cho ban VPS (3 ten mien). Sua ten mien that roi dat vao /etc/nginx/sites-available/ubm
# Backend chay Docker o 127.0.0.1:4005. SSL: sudo certbot --nginx -d api... -d quan-tri... -d nhan-vien...
# Ghi chu: anh diem danh ~5MB (JSON 10mb) nen mo client_max_body_size.

upstream ubm_backend {
  server 127.0.0.1:4005;
  keepalive 64;
}

# Map header Upgrade cho Socket.IO
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------- API + Socket.IO ----------
server {
  listen 80;
  server_name api.ten-mien-cua-ban;
  # certbot tu them listen 443 ssl khi chay --nginx
  client_max_body_size 15m;

  location / {
    proxy_pass http://ubm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

# ---------- Cong quan tri (static admin-web) ----------
server {
  listen 80;
  server_name quan-tri.ten-mien-cua-ban;
  root /opt/ubm/admin-web;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}

# ---------- Cong nhan vien (static employee-web, PWA mobile) ----------
server {
  listen 80;
  server_name nhan-vien.ten-mien-cua-ban;
  root /opt/ubm/employee-web;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
