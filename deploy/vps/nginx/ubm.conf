# Nginx cho ban VPS — 1 DOMAIN DUY NHAT (DuckDNS).
#   https://umbomilk-nhansu-diemdanh.duckdns.org/        -> cong nhan vien
#   https://umbomilk-nhansu-diemdanh.duckdns.org/admin/  -> cong quan tri
#   https://umbomilk-nhansu-diemdanh.duckdns.org/api/    -> backend API + Socket.IO
# Dat vao /etc/nginx/sites-available/ubm roi:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d umbomilk-nhansu-diemdanh.duckdns.org
# BAT BUOC HTTPS: camera + GPS tren dien thoai chi chay tren HTTPS.

upstream ubm_backend {
  server 127.0.0.1:4005;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name umbomilk-nhansu-diemdanh.duckdns.org;
  # certbot tu them listen 443 ssl + redirect http->https khi chay --nginx
  client_max_body_size 15m;

  # Nen gzip cho static/API: bundle admin ~1MB -> ~250KB, web mo nhanh hon.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

  # ---------- Backend API (strip /api prefix) + Socket.IO ----------
  location /api/ {
    rewrite ^/api/(.*) /$1 break;
    proxy_pass http://ubm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ---------- Socket.IO realtime ----------
  # Client Socket.IO mặc định gọi /socket.io/ (path mặc định, KHÔNG kèm /api),
  # phải proxy riêng kèm Upgrade header, nếu không request WS rơi vào static
  # -> handshake trả 200 (HTML) mà không lên 101 -> realtime chết, còn rơi về
  # long-polling thì cũng chết vì cùng path trả HTML.
  location /socket.io/ {
    proxy_pass http://ubm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long-polling giữ kết nối ~25s — timeout phải lớn hơn để không đứt liên tục
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # ---------- Cong quan tri ----------
  location /admin/ {
    alias /opt/ubm/admin-web/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
  }
  location /admin/assets/ {
    alias /opt/ubm/admin-web/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
  # PWA: service worker + manifest không được cache lâu, nếu không bản cũ sẽ
  # tiếp tục phục vụ và không nhận được bản cập nhật.
  location = /admin/sw.js {
    alias /opt/ubm/admin-web/sw.js;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /admin/manifest.webmanifest {
    alias /opt/ubm/admin-web/manifest.webmanifest;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # ---------- Cong nhan vien (mac dinh, PWA mobile) ----------
  location / {
    root /opt/ubm/employee-web;
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    root /opt/ubm/employee-web;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
  location = /sw.js {
    root /opt/ubm/employee-web;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    root /opt/ubm/employee-web;
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
