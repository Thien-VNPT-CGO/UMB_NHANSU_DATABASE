services:
  - type: web
    name: umbo-milk-hr-system
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      # Secrets — quản trị trong Render Dashboard (sync: false = không commit giá trị).
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://umb-nhansu-database-admin-web.vercel.app,https://umb-nhansu-database-employee-web.vercel.app,https://*.vercel.app,https://*.onrender.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: CANDIDATE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
