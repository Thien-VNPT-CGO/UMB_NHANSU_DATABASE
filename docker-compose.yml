# Chạy backend UBM HR bằng Docker Compose.
# 1. Copy apps/backend/.env.example -> apps/backend/.env, điền giá trị thật
#    (JWT_SECRET, CORS_ORIGINS, GOOGLE_SERVICE_ACCOUNT_JSON, SPREADSHEET_ID...)
# 2. docker compose up --build -d
# 3. Kiểm tra: curl http://localhost:4005/health
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-4005}:${BACKEND_PORT:-4005}"
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      PORT: ${BACKEND_PORT:-4005}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${BACKEND_PORT:-4005}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # "always" đảm bảo container ALWAYS sống lại sau khi VPS reboot/hồi phục, kể cả
    # khi trước đó có người docker stop thủ công (unless-stopped sẽ bỏ ngang).
    restart: always
    # Giới hạn dung lượng log Docker (stdout/stderr) để đĩa không đầy dần theo
    # thời gian — đĩa đầy là backend chết lặp lại + không tự sửa được.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
